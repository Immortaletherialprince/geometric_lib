name: CI Pipeline

on:
  push:
    branches:
      - master
      - release
  pull_request:
    branches:
      - master
      - release
      - develop

jobs:
  run-tests:
    runs-on: ubuntu-latest

    env:
      FULL_NAME: "Иванов Иван Иванович"
      GROUP_NUMBER: "123456"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print User Info
        run: echo "ФИО: $FULL_NAME, Группа: $GROUP_NUMBER, GitHub: $GITHUB_ACTOR"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/

      - name: Lint Code
        run: flake8 . || black .
